[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "microduck-rl-torch"
version = "0.1.0"
description = "Portable PyTorch-native Microduck simulation and training environment powered by mujoco-torch."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Ben Sprenger" }]
dependencies = [
    "huggingface_hub>=0.27",
    "mujoco>=3.0",
    "mujoco-torch",
    "numpy>=2.0",
    "onnx>=1.20.1",
    "onnxruntime>=1.18",
    "scipy>=1.16",
    "torch>=2.6",
]

[dependency-groups]
dev = [
    "build>=1.2",
    "deptry>=0.23",
    "hatchling>=1.27",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "ty>=0.0.1a20",
]
training = ["torchrl>=0.6"]
benchmark = ["matplotlib>=3.10.9"]
microduck-rl-warp = [
    "mjlab==1.3.0",
    "warp-lang==1.12.0",
    "better-actuator-models",
    "onnxruntime>=1.24.4",
    "rustypot>=1.4.2",
    "huggingface_hub>=0.27.0",
    "matplotlib>=3.10.9",
    "scipy>=1.16",
    "torch==2.9.1",
]

[project.scripts]
microduck-fetch-policy = "microduck_rl_torch.policies.huggingface:main"
microduck-validate = "microduck_rl_torch_verification.validate:main"
microduck-render = "microduck_rl_torch.rendering.cli:main"
microduck-convert-gif = "microduck_rl_torch.rendering.video_cli:main"

[tool.hatch.build]
# Keep VCS discovery out of the source distribution; the explicit sdist
# allowlist below defines the files that are published.
ignore-vcs = true

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/microduck_rl_torch", "src/microduck_rl_torch_verification"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "assets"

[tool.hatch.build.targets.sdist]
# Keep the source distribution limited to files needed to install, test, and
# reproduce the project. The include allowlist still applies the exclusions
# below, including to files at the root of an included directory.
include = [
    "src/**",
    "assets/**",
    "scripts/**",
    "tests/**",
    "docs/**",
    "typings/**",
    "README.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "Makefile",
    "pyproject.toml",
    "uv.lock",
]
exclude = [
    "/.gitignore",
    "/.gitattributes",
    "/.gitmodules",
    "/.git/**",
    "/.hg/**",
    "/.svn/**",
    "AGENTS.md",
    "**/.git/**",
    "**/.gitignore",
    "**/.gitattributes",
    "**/.gitmodules",
    "**/.hg/**",
    "**/.hgignore",
    "**/.hgtags",
    "**/.svn/**",
    "**/.svnignore",
    "**/CVS/**",
    "**/AGENTS.md",
    "**/.agents/**",
    "**/.codex/**",
    "**/.cache/**",
    "**/.pytest_cache/**",
    "**/.ruff_cache/**",
    "**/.DS_Store",
    "**/__pycache__",
    "**/*.py[cod]",
    "**/*.log",
    "**/*.LOG",
    "**/*.ses",
    "**/.coverage",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# These are the same compatibility overrides used by microduck_rl.
override-dependencies = [
    "protobuf>=4.0,<7.0",
    "onnx>=1.20.1",
    "zmq ; python_version < '3.0'",
]

[tool.uv.sources]
# Source branch: ben-microduck-fixes; pin its current immutable commit.
mujoco-torch = { git = "https://github.com/bsprenger/mujoco-torch.git", rev = "02456ded21c15e21cec5ebab99872ef9676afbd1" }
# Match the BAM revision recorded by the Microduck reference uv.lock.
better-actuator-models = { git = "https://github.com/Rhoban/bam.git", rev = "62bd8ce12154340be97e06f7f41a0ca8f116d967" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "integration: exercises the MuJoCo-Torch environment",
    "network: requires access to Hugging Face",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
